<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title> SportConnect – Chat </title>
        <link rel="stylesheet" href="chat.css">
    </head>
    <body>
        <div class="chat-container">
            <div class="chat_header">
                <h2>💬 Général</h2>
                <span class="status">● En ligne</span>
            </div>
            <div id="chat_box" class="chat_box"></div>
            <form id="send" class="row_container">
                <input type="text" id="new_message" class="new_message" placeholder="Écris ton message..." autocomplete="off">
                <button type="submit">Envoyer</button>
            </form>
        </div>
        <script src="chat/chat-client.js"></script>
        <script src="chat/chat.js"></script>
    </body>
</html>
