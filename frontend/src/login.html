<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportConnect – Connexion</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">
        <img src="assets/logo.svg" alt="SportConnect Logo">
      </div>
      <h1>SportConnect</h1>
      <p>Rencontre, discute et organise tes séances sportives</p>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Connexion</button>
      <button class="tab-btn" data-tab="register">Inscription</button>
    </div>

    <div id="msg-error" class="error-msg"></div>
    <div id="msg-success" class="success-msg"></div>

    <!-- Login Form -->
    <div id="login" class="form-section active">
      <div class="input-group">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" placeholder="Votre pseudo" autocomplete="username">
      </div>
      <div class="input-group">
        <label for="mdp">Mot de passe</label>
        <input type="password" id="mdp" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button id="send" class="submit-btn">Se connecter</button>
    </div>

    <!-- Register Form -->
    <div id="register" class="form-section">
      <div class="input-group">
        <label for="usernameR">Nom d'utilisateur</label>
        <input type="text" id="usernameR" placeholder="Choisissez un pseudo" autocomplete="username">
      </div>
      <div class="input-group">
        <label for="mdpR">Mot de passe</label>
        <input type="password" id="mdpR" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button id="sendR" class="submit-btn">Créer mon compte</button>
    </div>

    <div class="divider"><span>ou</span></div>
    <p style="text-align:center; color:#6b7280; font-size:0.85rem;">
      En continuant, vous acceptez nos conditions d'utilisation.
    </p>
  </div>

  <script src="auth/auth.js"></script>
</body>
</html>
